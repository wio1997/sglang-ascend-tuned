name: Ascend tuning package
on:
  push:
    paths: ['ascend_tuning/**', '.github/workflows/ascend-tuning-package.yml']
  pull_request:
    paths: ['ascend_tuning/**', '.github/workflows/ascend-tuning-package.yml']
permissions:
  contents: read
jobs:
  verify-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 ascend_tuning/tools/verify_package.py
